name: MyST Staging Preview

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write
  pages: write

jobs:
  build-and-preview:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install required Python packages
        run: pip install pyyaml

      - name: Install MyST CLI
        run: npm install -g mystmd

      - name: Dump issue body to file
        run: echo "${{ github.event.issue.body }}" > issue_body.txt

      - name: Parse Issue Data
        id: parse
        run: python scripts/parse_issue.py

      - name: Clone submitted repository into staging
        run: |
          ROOT_PATH="$ROOT_PATH"
          git clone "$REPO_URL" "temp_repo"
          rm -rf "temp_repo/.git"
          mkdir -p "staging/$ROOT_PATH"
          cp -r temp_repo/* "staging/$ROOT_PATH/"
          rm -rf temp_repo
        env:
          REPO_URL: ${{ env.REPO_URL }}

      - name: Build cookbook only
        run: |
          cd staging/$ROOT_PATH
          myst build --html
          cd ../..

      - name: List after build
        run: |
          echo "Inhalt nach Build in staging/$ROOT_PATH/_build:"
          ls -l staging/$ROOT_PATH/_build || echo "Kein _build Ordner"
          echo "Inhalt nach Build in staging/$ROOT_PATH/_build/html:"
          ls -l staging/$ROOT_PATH/_build/html || echo "Kein html Ordner"

      - name: Prepare deploy folder
        run: |
          mkdir -p preview_site
          if [ -d "staging/$ROOT_PATH/_build/html" ]; then
            cp -r staging/$ROOT_PATH/_build/html/* preview_site/
          else
            echo "❌ Build fehlgeschlagen oder kein HTML-Ausgabeordner gefunden."
            exit 1
          fi

      - name: Upload deploy artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview_site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment

      - name: Comment with preview link
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            👀 **Staging Preview deployed!**
            [Vorschau ansehen](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/index.html)