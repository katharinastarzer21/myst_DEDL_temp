name: MyST Staging

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  id-token: write
  pages: write

env:
  BASE_URL: /${{ github.event.repository.name }}
  GALLERY_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install dependencies
        run: |
          pip install pyyaml
          npm install -g mystmd

      - name: Dump issue body
        if: github.event_name == 'issues'
        run: echo "${{ github.event.issue.body }}" > issue_body.txt

      - name: Parse Issue Data
        if: github.event_name == 'issues'
        id: parse
        run: python scripts/parse_issue.py

      - name: Clone submitted repository
        run: |
          git clone "$REPO_URL" temp_repo
          rm -rf temp_repo/.git
          mkdir -p staging/$ROOT_PATH
          cp -r temp_repo/* staging/$ROOT_PATH/
        env:
          REPO_URL: ${{ env.REPO_URL }}
          ROOT_PATH: ${{ env.ROOT_PATH }}

      - name: Build notebook site
        run: |
          cd staging/${{ env.ROOT_PATH }}
          myst build --html

      - name: Prepare deploy folder
        run: |
          mkdir -p full_site/staging/${{ env.ROOT_PATH }}
          cp -r staging/${{ env.ROOT_PATH }}/_build/html/* full_site/staging/${{ env.ROOT_PATH }}/

      - name: Upload deploy artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: full_site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Comment with preview link
        if: github.event_name == 'issues'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ✅ **Cookbook deployed to preview!**
            🔗 [${{ env.COOKBOOK_TITLE }}](${{ env.GALLERY_URL }}/staging/${{ env.ROOT_PATH }}/index.html)
