name: MyST Staging Preview

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-preview:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install required Python packages
        run: pip install pyyaml

      - name: Install MyST CLI
        run: npm install -g mystmd

      - name: Parse Issue Data (get repo URL and name)
        id: parse
        run: |
          echo "${{ github.event.issue.body }}" > issue_body.txt
          python3 <<EOF
          import re
          import os
          body = open('issue_body.txt').read()
          # Try to find a GitHub repo URL in the body
          m = re.search(r'https://github.com/([A-Za-z0-9_.-]+)/([A-Za-z0-9_.-]+)', body)
          if m:
              org, repo = m.groups()
              repo_url = f"https://github.com/{org}/{repo}.git"
              repo_name = repo
              print(f"::set-output name=repo_url::{repo_url}")
              print(f"::set-output name=repo_name::{repo_name}")
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write(f"REPO_URL={repo_url}\nREPO_NAME={repo_name}\n")
          else:
              raise Exception("No GitHub repo URL found in issue body")
          EOF

      - name: Clone submitted repository into staging
        run: |
          git clone "$REPO_URL" "staging/$REPO_NAME"
        env:
          REPO_URL: ${{ env.REPO_URL }}
          REPO_NAME: ${{ env.REPO_NAME }}

      - name: Build the submitted repo
        run: |
          cd "staging/$REPO_NAME"
          myst build --html
          cd ../..

      - name: List build output for debugging
        run: |
          ls -l staging/"$REPO_NAME"/_build/html || echo "No build output found"

      - name: Prepare deploy folder for staging
        run: |
          mkdir -p full_site/staging/"$REPO_NAME"
          cp -r staging/"$REPO_NAME"/_build/html/. full_site/staging/"$REPO_NAME"/
          touch full_site/.nojekyll

      - name: Upload staging artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: full_site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment

      - name: Print preview URL as comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ✨ **Staging preview deployed!**
            [Preview in staging](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/staging/${{ env.REPO_NAME }}/index.html)