name: MyST Staging Preview

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  id-token: write
  pages: write

env:
  BASE_URL: /${{ github.event.repository.name }}

jobs:
  build-and-preview:
    runs-on: ubuntu-latest

    # Only run if issue is opened by specific users (optional)
    if: >
      github.event_name != 'issues' ||
      (
        github.event_name == 'issues' &&
        github.event.action == 'opened' &&
        (github.actor == 'katharinastarzer21' || github.actor == 'koenifra')
      )

    env:
      GALLERY_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install required Python packages
        run: pip install pyyaml

      - name: Install MyST CLI
        run: npm install -g mystmd

      - name: Dump issue body to file
        if: github.event_name == 'issues'
        run: echo "${{ github.event.issue.body }}" > issue_body.txt

      - name: Parse Issue Data
        if: github.event_name == 'issues'
        id: parse
        run: python scripts/parse_issue.py

      - name: Clone submitted repository into staging
        if: github.event_name == 'issues'
        run: |
          ROOT_PATH="$ROOT_PATH"
          COOKBOOK_TITLE="$COOKBOOK_TITLE"
          git clone "$REPO_URL" "temp_repo"
          rm -rf "temp_repo/.git"
          mkdir -p "staging/$ROOT_PATH"
          cp -r temp_repo/* "staging/$ROOT_PATH/"
          rm -rf temp_repo
        env:
          REPO_URL: ${{ env.REPO_URL }}
          
      - name: Append new cookbook to myst.yml (optional for staging)
        if: github.event_name == 'issues'
        run: python scripts/rebuild_gallery_toc.py
        env:
          COOKBOOK_NAME: ${{ env.ROOT_PATH }}

      - name: Build main gallery
        run: myst build --html

      - name: Prepare deploy folder
        run: |
          mkdir -p full_site
          cp -r _build/html/* full_site/

      - name: Upload deploy artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: full_site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment

      - name: Comment with preview link
        if: github.event_name == 'issues'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            👀 **Preview deployed!**
            📘 [${{ env.COOKBOOK_TITLE }} (Staging)](${{ env.GALLERY_URL }}/staging/${{ env.ROOT_PATH }}/index.html)