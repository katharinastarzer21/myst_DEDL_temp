name: MyST Staging Preview

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write
  pages: write

env:
  BASE_URL: /${{ github.event.repository.name }}

jobs:
  build-and-preview:
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'issues' &&
      (github.actor == 'katharinastarzer21' || github.actor == 'koenifra')

    env:
      GALLERY_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install required Python packages
        run: pip install pyyaml

      - name: Install MyST CLI
        run: npm install -g mystmd

      - name: Dump issue body to file
        run: echo "${{ github.event.issue.body }}" > issue_body.txt

      - name: Parse Issue Data
        id: parse
        run: python scripts/parse_issue.py
        # Ensure this sets $ROOT_PATH, $REPO_URL, $COOKBOOK_TITLE

      - name: Clone submitted repository into staging
        run: |
          ROOT_PATH="$ROOT_PATH"
          git clone "$REPO_URL" "temp_repo"
          rm -rf "temp_repo/.git"
          mkdir -p "staging/$ROOT_PATH"
          cp -r temp_repo/* "staging/$ROOT_PATH/"
          rm -rf temp_repo
        env:
          REPO_URL: ${{ env.REPO_URL }}

      - name: Build staging cookbook
        run: |
          cd "staging/$ROOT_PATH"
          myst build --html
          cd ../..

      - name: Prepare staging deploy folder
        run: |
          mkdir -p full_site/staging
          cp -r staging/* full_site/staging/

      - name: Upload staging artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: full_site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment

      - name: Comment with preview link
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ✨ **Staging preview ready!**
            [${{ env.COOKBOOK_TITLE }} Preview](${{ env.GALLERY_URL }}/staging/${{ env.ROOT_PATH }}/README.html)