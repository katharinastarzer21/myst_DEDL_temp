name: Validate Notebooks

on:
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: List changed notebooks
        id: changes
        run: |
          FILES=$(git diff --name-only origin/main...HEAD | grep ".ipynb" || true)
          {
            echo 'CHANGED<<EOF'
            echo "$FILES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Validate notebooks
        if: contains(steps.changes.outputs.CHANGED, '.ipynb')
        run: |
          for nb in ${{ steps.changes.outputs.CHANGED }}; do
            python scripts/validate_notebook.py "$nb"
          done
